name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller mutagen
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SRT_Sync app.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRT_Sync_Windows11_EXE
          path: dist/SRT_Sync.exe
          if-no-files-found: error
          retention-days: 14
